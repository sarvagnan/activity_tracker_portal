[project]
name = "activity-tracker-portal"
version = "0.1.0"
description = "A local-first, single-person portal for inspectable health and activity evidence"
readme = "README.md"
authors = [
    { name = "sarvagnan", email = "github@sl.sarva.email" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[project.scripts]
portal = "activity_tracker_portal.cli:main"

[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]
