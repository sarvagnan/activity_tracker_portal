name: Project CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check Portal runtime
        run: uv run portal runtime
      - name: Run Portal unit tests
        run: uv run python -m unittest discover -s tests/unit -v
      - name: Validate governed project contracts
        run: uv run python -m unittest discover -s tests/governance -v
      - name: Run ingest-protocol@1 acceptance
        run: tests/acceptance/run_ingest_protocol_1.sh
      - name: Run operational-store@1 acceptance
        run: tests/acceptance/run_operational_store_1.sh
      - name: Run operational-store@2 acceptance
        run: tests/acceptance/run_operational_store_2.sh
      - name: Run manage-sender-installation@1 acceptance
        run: tests/acceptance/run_manage_sender_installation_1.sh
      - name: Run accept-ingest-batch@1 acceptance
        run: tests/acceptance/run_accept_ingest_batch_1.sh
      - name: Run accept-capability-acknowledgement@1 acceptance
        run: tests/acceptance/run_accept_capability_acknowledgement_1.sh
      - name: Run accept-sync-completion@1 acceptance
        run: tests/acceptance/run_accept_sync_completion_1.sh
      - name: Run accept-sync-checkpoint@1 acceptance
        run: tests/acceptance/run_accept_sync_checkpoint_1.sh

  sender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned Sender dependencies
        run: npm ci --prefix sender
      - name: Check TypeScript and run synthetic Node suites
        run: |
          npm run typecheck --prefix sender
          npm test --prefix sender
      - name: Generate the pinned Android development project
        run: npm run prebuild --prefix sender
      - name: Run synthetic Health Connect Kotlin JVM tests
        run: npm run test:kotlin --prefix sender
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Run project-source-record@1 acceptance
        run: tests/acceptance/run_project_source_record_1.sh
      - name: Run read-snapshot-page@1 acceptance
        run: tests/acceptance/run_read_snapshot_page_1.sh
      - name: Run read-change-page@1 acceptance
        run: tests/acceptance/run_read_change_page_1.sh
      - name: Run begin-initial-snapshot@1 acceptance
        run: tests/acceptance/run_begin_initial_snapshot_1.sh
      - name: Run stage-outbox-batch@1 acceptance
        run: tests/acceptance/run_stage_outbox_batch_1.sh
      - name: Run begin-initial-snapshot@2 acceptance
        run: tests/acceptance/run_begin_initial_snapshot_2.sh
      - name: Run begin-reconciliation-snapshot@1 acceptance
        run: tests/acceptance/run_begin_reconciliation_snapshot_1.sh
      - name: Run stage-sync-completion@1 acceptance
        run: tests/acceptance/run_stage_sync_completion_1.sh
      - name: Run stage-sync-checkpoint@1 acceptance
        run: tests/acceptance/run_stage_sync_checkpoint_1.sh
      - name: Run coordinate-sender-sync@1 acceptance
        run: tests/acceptance/run_coordinate_sender_sync_1.sh
      - name: Run schedule-background-polling@1 acceptance
        run: tests/acceptance/run_schedule_background_polling_1.sh

  vouch:
    needs: [test, sender]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/vouch.yml
    with:
      anchoring: true
    permissions:
      contents: write
